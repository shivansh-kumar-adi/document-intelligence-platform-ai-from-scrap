[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-intelligence"
version = "1.0.0"
description = "Source-grounded document intelligence with hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "pymupdf==1.25.5",
  "python-docx==1.1.2",
  "httpx==0.28.1",
]

[project.optional-dependencies]
ai = ["chromadb==1.0.7", "sentence-transformers==4.1.0", "google-genai==1.15.0"]
postgres = ["psycopg[binary]==3.2.9"]
test = ["pytest==8.3.5", "pytest-cov==6.1.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

